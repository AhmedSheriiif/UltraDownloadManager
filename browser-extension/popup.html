<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 240px;
      font-family: Segoe UI, sans-serif;
      background: #1e1e1e;
      color: #e8e8e8;
      margin: 0;
      padding: 14px;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    p {
      font-size: 11px;
      color: #9a9a9a;
      margin: 10px 0 0;
    }
  </style>
</head>
<body>
  <h1>Ultra Download Manager</h1>
  <label>
    <input type="checkbox" id="autoCaptureToggle" />
    Auto-capture browser downloads
  </label>
  <p>When on, downloads started in this browser are sent straight to Ultra Download Manager instead of saving through the browser. Right-click a link or media to send it manually any time.</p>
  <script src="popup.js"></script>
</body>
</html>
